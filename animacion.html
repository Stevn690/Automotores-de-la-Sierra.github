<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tipos de Carrocerías</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: linear-gradient(135deg, #5080e2, #173568, #2aaad1);
    }

    header {
      width: 100%;
      text-align: center;
      padding: 20px;
      border-bottom: double 5px #004080;
      background-color: white;
    }

    header img {
      height: 80px;
      filter: grayscale(30%) drop-shadow(2px 2px 5px gray);
      transform: rotateY(10deg);
      transition: transform 1s ease;
    }

    header img:hover {
      transform: rotateY(360deg);
    }

    header h1 {
      background: linear-gradient(90deg, #0c0b52, #65bae4);
      -webkit-background-clip: text;
      color: transparent;
      font-size: 2em;
      margin-top: 10px;
    }

    nav {
      width: 100%;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 15px;
      padding: 15px;
      background-color: #004080;
      border-bottom: double 4px #002244;
    }

    nav a {
      color: white;
      text-decoration: none;
      padding: 10px 20px;
      background-color: #0066cc;
      border-radius: 10px;
      transition: all 0.3s ease;
    }

    nav a:hover {
      background-color: #003366;
      transform: scale(1.1);
    }

    .animated-box {
      width: 120px;
      height: 120px;
      margin: 40px 0;
      background-color: rgb(86, 13, 119);
      position: relative;
      animation: example 4s infinite;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      font-weight: bold;
      text-align: center;
      border-radius: 10px;
    }

    @keyframes example {
      0% {
        background-color: rgb(38, 11, 134);
        left: 0px;
        top: 0px;
        transform: rotate(50deg);
      }
      25% {
        background-color: rgb(68, 104, 172);
        left: 200px;
        top: 0px;
        color: rgb(26, 199, 69);
      }
      50% {
        background-color: rgb(0, 238, 255);
        left: 200px;
        top: 200px;
        color: rgb(31, 14, 107);
      }
      75% {
        background-color: rgb(111, 207, 32);
        left: 0px;
        top: 200px;
        color: rgb(204, 22, 180);
      }
      100% {
        background-color: rgb(126, 207, 20);
        left: 0px;
        top: 0px;
        color: rgb(209, 32, 32);
      }
    }
  </style>
</head>
<body>
    <header>
        <img src="assa logo azul blan.avif" alt="Logo del Sindicato" />
        <h1>(ASSA) Automotores de la Sierra S.A</h1>
        <p>Comprometidos con la excelencia y profesionalismo desde 1960</p>
      </header>

  <nav>

    <a href="index.html">Carrocerias</a> 
    <a href="#contacto">Contactos</a>
    <a href="index1.html">¿Porque elegirnos?</a>
    <a href="cubo assa.html">Cubo Assa</a>
    <a href="caratula.html">Inicio</a>
  </nav>

  <div class="animated-box">
    <p>Automotores</p>
    <span>ASSA</span>
  </div>
</body>
</html>
